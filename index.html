<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Türk Mutfağı Haftası Davetiyesi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap');

    /* Global reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Print page settings */
    @page {
      size: A5 landscape;
      margin: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1e293b;
      padding: 20px;
    }

    @media print {
      body {
        background-color: #ffffff;
        padding: 0;
        margin: 0;
        min-height: auto;
        width: 210mm;
        height: 148mm;
      }
      .card-container {
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        width: 210mm !important;
        height: 148mm !important;
      }
      .print-btn {
        display: none !important;
      }
      /* Force all background graphics, colors and details to print */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

    /* Card Container: Exact horizontal A5 dimensions */
    .card-container {
      width: 210mm;
      height: 148mm;
      background-color: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Spoons Watermark Background: Faded to stay completely in background */
    .spoons-bg {
      position: absolute;
      right: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-image: url('some/spoons.png');
      background-size: cover;
      background-position: right center;
      background-repeat: no-repeat;
      opacity: 0.08;
      z-index: 1;
    }

    /* Outer Gold Border Frame */
    .card-inner {
      position: absolute;
      top: 5mm;
      left: 5mm;
      right: 5mm;
      bottom: 5mm;
      border: 1px solid #e2d1a6;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 6mm 10mm;
      z-index: 2;
    }

    /* Main Logo: Large and centered */
    .main-logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1mm;
    }
    
    .main-logo {
      height: 25mm;
      width: auto;
      display: block;
    }

    /* Host Title */
    .host-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 8.5pt;
      font-weight: 600;
      color: #475569;
      letter-spacing: 1.2px;
      line-height: 1.35;
      text-align: center;
      margin-bottom: 2mm;
    }

    /* Invitation Text */
    .invitation-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14pt;
      font-weight: 600;
      font-style: italic;
      color: #b02a1e;
      line-height: 1.45;
      text-align: center;
      margin-bottom: 3.5mm;
      max-width: 155mm;
    }

    /* Horizontal Program List on a single line */
    .program-horizontal {
      display: flex;
      justify-content: center;
      align-items: center;
      column-gap: 4.5mm;
      width: 100%;
      margin-bottom: 4mm;
    }

    .program-item {
      font-family: 'Montserrat', sans-serif;
      font-size: 8pt;
      font-weight: 500;
      color: #334155;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .program-item:not(:last-child)::after {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      background-color: #c29b47;
      transform: rotate(45deg);
      margin-left: 4.5mm;
      flex-shrink: 0;
    }

    /* Info Bar (Date, Time, Venue) */
    .info-bar {
      border-top: 1px solid #e2d1a6;
      border-bottom: 1px solid #e2d1a6;
      padding: 2.5mm 0;
      margin-bottom: 4mm;
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 140mm;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .info-divider {
      width: 1px;
      height: 5mm;
      background-color: #ebdcb9;
    }

    .info-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 6.5pt;
      font-weight: 600;
      text-transform: uppercase;
      color: #8b7447;
      letter-spacing: 0.8px;
      margin-bottom: 0.5mm;
    }

    .info-value {
      font-family: 'Montserrat', sans-serif;
      font-size: 8.5pt;
      font-weight: 500;
      color: #1e293b;
    }

    /* Sponsor/Protocol Logos Centered at bottom */
    .sponsors-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7mm;
      margin-top: 1mm;
    }

    .sponsor-logo {
      height: 11mm;
      width: auto;
      display: block;
      mix-blend-mode: multiply;
    }

    /* Floating Print Button */
    .print-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background-color: #b02a1e;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
    }

    .print-btn:hover {
      background-color: #8a1f15;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .print-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Spoons watermark background graphic -->
    <div class="spoons-bg"></div>

    <!-- Gold border frame with centered content -->
    <div class="card-inner">
      
      <!-- Main Event Logo -->
      <div class="main-logo-container">
        <img src="logos/logo.png" alt="Türk Mutfağı Haftası" class="main-logo">
      </div>

      <!-- Host Name -->
      <div class="host-title">Van İl Kültür ve Turizm Müdürü Abdurrrahman Şahin</div>
      
      <!-- Invitation Text -->
      <div class="invitation-text">
        Türk Mutfağı Haftası kapsamında düzenlenecek programa teşriflerinizi bekleriz.
      </div>

      <!-- Horizontal Program Items on a single line -->
      <div class="program-horizontal">
        <span class="program-item">Geleneksel Van Yemekleri Sunumu</span>
        <span class="program-item">Van Kahvaltısı Sergisi</span>
        <span class="program-item">Yöresel Otlar Sergisi</span>
        <span class="program-item">Workshoplar</span>
        <span class="program-item">İkramlar</span>
      </div>

      <!-- Date, Time, Venue Info Bar -->
      <div class="info-bar">
        <div class="info-item">
          <span class="info-label">Tarih</span>
          <span class="info-value">21 Mayıs 2026</span>
        </div>
        <div class="info-divider"></div>
        <div class="info-item">
          <span class="info-label">Saat</span>
          <span class="info-value">11:00</span>
        </div>
        <div class="info-divider"></div>
        <div class="info-item">
          <span class="info-label">Yer</span>
          <span class="info-value">Kent Meydanı</span>
        </div>
      </div>

      <!-- Protocol / Sponsor Logos Centered -->
      <div class="sponsors-row">
        <img src="logos/tkb.jpeg" class="sponsor-logo" alt="TKB">
        <img src="logos/vv.png" class="sponsor-logo" alt="VV">
        <img src="logos/vbb.png" class="sponsor-logo" alt="VBB">
      </div>

    </div>

  </div>

  <!-- Print Button (Hidden on Print) -->
  <button class="print-btn" onclick="window.print()">
    <svg viewBox="0 0 24 24">
      <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
    </svg>
    PDF Olarak Kaydet
  </button>

</body>
</html>
